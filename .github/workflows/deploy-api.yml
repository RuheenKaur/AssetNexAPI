name: Deploy API to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Angular dist artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          workflow: build-angular.yml
          repo: RuheenKaur/AssetNex
          branch: main
          name: angular-dist
          path: ./AssetNex.API/wwwroot
          if_no_artifact_found: fail

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: ./AssetNex.API
        run: dotnet restore

      - name: Build API
        working-directory: ./AssetNex.API
        run: dotnet build --configuration Release --no-restore
        
      - name: Publish API
        working-directory: ./AssetNex.API
        run: dotnet publish --configuration Release --no-build --output ${{github.workspace}}/publish -r win-x86 --self-contained false
   
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AssetNexIT'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ${{github.workspace}}/publish
